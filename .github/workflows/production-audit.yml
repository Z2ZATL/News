name: Production audit

on:
  schedule:
    - cron: "17 2 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify live headers, public feeds, and DNS ownership
        env:
          AUDIT_DNSSEC_ENABLED: "true"
          AUDIT_PRODUCTION_READY: "true"
          AUDIT_PUBLIC_CNAME: z2zs-lab-news.netlify.app
          AUDIT_SITE_URL: https://news.z2zs.space
        run: node scripts/production-audit.mjs
