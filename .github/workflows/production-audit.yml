name: Production audit

on:
  schedule:
    - cron: "17 2 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify live headers, public feeds, and DNS ownership
        env:
          AUDIT_CNAME_SUFFIX: ${{ vars.AUDIT_CNAME_SUFFIX }}
          AUDIT_DNSSEC_ENABLED: ${{ vars.AUDIT_DNSSEC_ENABLED }}
          AUDIT_MAIL_POLICY_ENABLED: ${{ vars.AUDIT_MAIL_POLICY_ENABLED }}
          AUDIT_PRODUCTION_READY: ${{ vars.AUDIT_PRODUCTION_READY }}
          AUDIT_SITE_URL: https://news.z2zs.space
          AUDIT_STUDIO_ENABLED: ${{ vars.AUDIT_STUDIO_ENABLED }}
          AUDIT_STUDIO_URL: https://studio.z2zs.space
        run: node scripts/production-audit.mjs
