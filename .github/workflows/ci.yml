name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  public-site:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm peers check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:unit
      - run: pnpm content:migrate
      - run: pnpm scan:secrets
      - run: pnpm build
      - run: pnpm --package=netlify-cli@27.0.0 dlx netlify build --offline --context deploy-preview
      - run: pnpm audit --audit-level=moderate
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:lighthouse
      - run: pnpm test:e2e

  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SANITY_STUDIO_PROJECT_ID: testproject
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm peers check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm typegen
      - run: git diff --exit-code -- ../src/sanity.types.ts schema.json
      - run: pnpm build
      - run: pnpm --package=netlify-cli@27.0.0 dlx netlify build --offline --context deploy-preview
      - run: pnpm audit --audit-level=moderate
